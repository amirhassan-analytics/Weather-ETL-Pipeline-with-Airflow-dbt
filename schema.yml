version: 2

sources:
  - name: weather
    database: weather
    schema: public
    tables:
      - name: staging_weather

models:
  - name: staging_weather
    columns:
      - name: city
        tests: [not_null]
      - name: timestamp
        tests: [not_null]
      - name: temperature_2m
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 50
  - name: fact_daily_weather
    columns:
      - name: city
        tests: [not_null]
      - name: date
        tests: [not_null]
